name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build --workspace server
      - run: npm run test --workspace server

  debug-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y gdb
      - run: npm ci
      - run: npm run build --workspace server
      - run: npm run build --workspace debug
      # fasm2 isn't installed on CI runners, so the tests that need a real compiled binary
      # (GdbDriver/session e2e) skip themselves gracefully; the listing/MI parser tests, which
      # run against pre-captured real fasm2/gdb output fixtures, always run here regardless.
      - run: npm run test --workspace debug

  package-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Run extension integration tests (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test --workspace extension

      # No retry wrapper. This step used to loop three times, on the theory that
      # "spawn .../Contents/MacOS/Electron ENOENT" was @vscode/test-electron's zip extraction
      # dropping files. It was not: VS Code 1.110 renamed the macOS bundle's main binary from
      # `Electron` to the product name (`Code`), and 1.133 removed the compatibility symlink that
      # had kept the old name resolving. Every attempt looked for a file that no current build
      # ships, so all three failed identically. @vscode/test-electron 3.1.0 reads the real name
      # from the bundle's Info.plist; the pinned floor for that is in extension/package.json.
      - name: Run extension integration tests (macOS/Windows)
        if: runner.os != 'Linux'
        run: npm run test --workspace extension

      - name: Package VSIX
        run: npx vsce package --no-dependencies -o fasm2-studio-${{ matrix.os }}.vsix
        working-directory: extension

      - uses: actions/upload-artifact@v7
        with:
          name: fasm2-studio-${{ matrix.os }}
          path: extension/*.vsix
