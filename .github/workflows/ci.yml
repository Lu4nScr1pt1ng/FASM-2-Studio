name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build --workspace server
      - run: npm run test --workspace server

  debug-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y gdb
      - run: npm ci
      - run: npm run build --workspace server
      - run: npm run build --workspace debug
      # fasm2 isn't installed on CI runners, so the tests that need a real compiled binary
      # (GdbDriver/session e2e) skip themselves gracefully; the listing/MI parser tests, which
      # run against pre-captured real fasm2/gdb output fixtures, always run here regardless.
      - run: npm run test --workspace debug

  package-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Run extension integration tests (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test --workspace extension

      - name: Run extension integration tests (macOS/Windows)
        if: runner.os != 'Linux'
        shell: bash
        # @vscode/test-electron downloads and unzips VS Code itself before every run; on macOS/
        # Windows this has a known, long-standing flaky failure mode where the extracted app
        # bundle is missing files jszip failed to unpack correctly (e.g. "spawn .../Contents/
        # MacOS/Electron ENOENT" right after a "successful" download -- see microsoft/vscode-test
        # #308, the same symptom recurring across major versions of the tool). Nothing here is
        # cached between attempts, so a plain retry gets a fresh, usually-clean download; clearing
        # .vscode-test first guards against retrying against the same corrupted extraction were
        # that ever not the case.
        run: |
          for attempt in 1 2 3; do
            npm run test --workspace extension && exit 0
            echo "::warning::extension integration tests failed (attempt $attempt/3), likely @vscode/test-electron's known macOS/Windows zip-extraction flakiness -- retrying with a clean download"
            rm -rf extension/.vscode-test
          done
          exit 1

      - name: Package VSIX
        run: npx vsce package --no-dependencies -o fasm2-studio-${{ matrix.os }}.vsix
        working-directory: extension

      - uses: actions/upload-artifact@v7
        with:
          name: fasm2-studio-${{ matrix.os }}
          path: extension/*.vsix
